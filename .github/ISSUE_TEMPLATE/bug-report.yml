name: Bug report
description: Report a reproducible DSH Desktop or DSH Remote failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DSH Desktop and DSH Remote. Remove API keys, pairing tokens, QR codes, private prompts, private paths, Tailnet details, and workspace content from every field, log, screenshot, and attachment.
  - type: input
    id: version
    attributes:
      label: DSH Desktop or Remote version
      description: Find this in the release filename, Desktop sidebar, or Remote About and privacy screen.
      placeholder: 0.4.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: input
    id: device-details
    attributes:
      label: Device and OS details
      description: For mobile issues, include the manufacturer, model, and exact Android or iOS version. For Desktop, include the OS version.
      placeholder: Google Pixel 9, Android 16 / iPhone 16, iOS 19.0 / macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: remote-connection
    attributes:
      label: Remote connection type
      description: Select the connection used when the problem occurred.
      options:
        - Same trusted Wi-Fi
        - Tailscale Serve HTTPS
        - Custom HTTPS
        - Offline Demo
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste only the shortest useful, redacted log excerpt. Never include a QR code, pairing token, API key, private prompt, source code, Tailnet name, or private address.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reproduced this with the latest applicable stable release or GitHub pre-release.
          required: true
        - label: I removed all QR codes, credentials, tokens, private prompts, addresses, paths, and workspace data.
          required: true
