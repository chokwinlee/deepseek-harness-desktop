name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm test

  tauri-check:
    name: tauri-check (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: bash -n scripts/build-tauri.sh scripts/verify-tauri.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare test-only Tauri sidecar
        run: |
          target="$(rustc -vV | awk '/^host:/ { print $2 }')"
          mkdir -p src-tauri/binaries
          install -m 755 /usr/bin/true "src-tauri/binaries/node-${target}"
          install -m 755 /usr/bin/true "src-tauri/binaries/dsh-${target}"
          install -m 755 /usr/bin/true "src-tauri/binaries/pnpm-${target}"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  android:
    name: android (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build.gradle.kts
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify Android Remote
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug lintRelease validateDebugScreenshotTest verifyReleaseVersionCodeOrdering assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsh-remote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
